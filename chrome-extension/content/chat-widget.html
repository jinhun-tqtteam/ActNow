<div id="actnow-chat-widget">
    <!-- Floating chat button -->
    <div id="actnow-chat-button" class="actnow-chat-button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4C2.9 2 2 2.9 2 4V18C2 19.1 2.9 20 4 20H18L22 24V4C22 2.9 21.1 2 20 2Z" fill="currentColor"/>
        </svg>
        <span class="actnow-notification-badge" id="actnow-notification-badge" style="display: none;">1</span>
    </div>

    <!-- Chat container -->
    <div id="actnow-chat-container" class="actnow-chat-container">
        <!-- Header -->
        <div class="actnow-chat-header">
            <div class="actnow-header-title">
                <h3>ActNow Assistant</h3>
                <span class="actnow-status-indicator actnow-status-online"></span>
            </div>
            <div class="actnow-header-actions">
                <button id="actnow-settings-btn" class="actnow-icon-btn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.14 12.94C19.18 12.64 19.2 12.33 19.2 12C19.2 11.68 19.18 11.36 19.14 11.06L20.85 9.74C21.03 9.6 21.08 9.34 20.97 9.14L19.47 6.46C19.36 6.26 19.11 6.19 18.91 6.26L16.9 7.03C16.42 6.67 15.91 6.36 15.35 6.13L15.05 4.02C15.02 3.8 14.84 3.63 14.61 3.63H9.39C9.16 3.63 8.98 3.8 8.95 4.02L8.65 6.13C8.09 6.36 7.58 6.67 7.1 7.03L5.09 6.26C4.89 6.19 4.64 6.26 4.53 6.46L3.03 9.14C2.92 9.34 2.97 9.6 3.15 9.74L4.86 11.06C4.82 11.36 4.8 11.68 4.8 12C4.8 12.33 4.82 12.64 4.86 12.94L3.15 14.26C2.97 14.4 2.92 14.66 3.03 14.86L4.53 17.54C4.64 17.74 4.89 17.81 5.09 17.74L7.1 16.97C7.58 17.33 8.09 17.64 8.65 17.87L8.95 19.98C8.98 20.2 9.16 20.37 9.39 20.37H14.61C14.84 20.37 15.02 20.2 15.05 19.98L15.35 17.87C15.91 17.64 16.42 17.33 16.9 16.97L18.91 17.74C19.11 17.81 19.36 17.74 19.47 17.54L20.97 14.86C21.08 14.66 21.03 14.4 20.85 14.26L19.14 12.94ZM12 15.5C10.07 15.5 8.5 13.93 8.5 12C8.5 10.07 10.07 8.5 12 8.5C13.93 8.5 15.5 10.07 15.5 12C15.5 13.93 13.93 15.5 12 15.5Z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="actnow-minimize-btn" class="actnow-icon-btn" title="Minimize">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.3 5.71L12 12.01L5.7 5.71L4.29 7.12L10.59 13.42L4.29 19.72L5.7 21.13L12 14.83L18.3 21.13L19.71 19.72L13.41 13.42L19.71 7.12L18.3 5.71Z" fill="currentColor" transform="rotate(45 12 12)"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages area -->
        <div id="actnow-messages" class="actnow-messages">
            <div class="actnow-welcome-message">
                <div class="actnow-welcome-icon">👋</div>
                <div class="actnow-welcome-text">
                    <h4>Welcome to ActNow Assistant!</h4>
                    <p>I'm here to help you with any questions. What can I assist you with today?</p>
                </div>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="actnow-typing-indicator" class="actnow-typing-indicator" style="display: none;">
            <span class="actnow-typing-dot"></span>
            <span class="actnow-typing-dot"></span>
            <span class="actnow-typing-dot"></span>
        </div>

        <!-- Input area -->
        <div class="actnow-input-container">
            <textarea id="actnow-message-input" class="actnow-message-input" placeholder="Type your message..." rows="1"></textarea>
            <button id="actnow-send-btn" class="actnow-send-btn" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="actnow-settings-modal" class="actnow-modal" style="display: none;">
        <div class="actnow-modal-content">
            <div class="actnow-modal-header">
                <h3>Settings</h3>
                <button class="actnow-modal-close" id="actnow-settings-close">&times;</button>
            </div>
            <div class="actnow-modal-body">
                <div class="actnow-form-group">
                    <label for="actnow-api-key">OpenRouter API Key</label>
                    <input type="password" id="actnow-api-key" placeholder="Enter your API key" class="actnow-form-input">
                    <small>Get your API key from <a href="https://openrouter.ai" target="_blank">OpenRouter.ai</a></small>
                </div>
                <div class="actnow-form-group">
                    <label for="actnow-model">AI Model</label>
                    <select id="actnow-model" class="actnow-form-select">
                        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="openai/gpt-4o">GPT-4o</option>
                        <option value="google/gemini-pro">Gemini Pro</option>
                        <option value="meta-llama/llama-3.1-405b-instruct">Llama 3.1 405B</option>
                        <option value="mistralai/mixtral-8x7b-instruct">Mixtral 8x7B</option>
                    </select>
                </div>
                <div class="actnow-form-group">
                    <label for="actnow-theme">Theme</label>
                    <select id="actnow-theme" class="actnow-form-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                        <option value="auto">Auto</option>
                    </select>
                </div>
                <div class="actnow-form-actions">
                    <button id="actnow-clear-history" class="actnow-btn-secondary">Clear History</button>
                    <button id="actnow-save-settings" class="actnow-btn-primary">Save Settings</button>
                </div>
            </div>
        </div>
    </div>
</div>
